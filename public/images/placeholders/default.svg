    <path d="M90 32 L90 75 L50 97 L50 54 Z" fill="#a8dab5" stroke="#137333" stroke-width="3" stroke-linejoin="round" />
    <path d="M50 54 L50 97" stroke="#137333" stroke-width="3" />
  </g>
  
  <!-- Text Label -->
  <text x="400" y="380" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">
    waris.in
  </text>
  <text x="400" y="410" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600" fill="#64748b" text-anchor="middle">
