<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="dot-pattern" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#e2e8f0" />
    </pattern>
  </defs>
  <!-- Background Solid -->
  <rect width="800" height="600" fill="#f8fafc" />
  <rect width="800" height="600" fill="url(#dot-pattern)" />
  
  <!-- Subtle Framing Container -->
  <rect x="250" y="150" width="300" height="300" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Vector Package Icon -->
