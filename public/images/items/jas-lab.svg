<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="jas-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#e2e8f0" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#f8fafc" />
  <rect width="800" height="600" fill="url(#jas-dots)" />
  <ellipse cx="400" cy="520" rx="180" ry="22" fill="#cbd5e1" opacity="0.6" />

  <!-- Lab Coat Graphic -->
  <g transform="translate(250, 100)">
    <!-- Coat Outline/Body -->
    <path d="M 100,50 L 50,110 L 20,280 L 70,290 L 80,180 L 80,390 L 220,390 L 220,180 L 230,290 L 280,280 L 250,110 L 200,50 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Collar & Lapels -->
    <path d="M 100,50 L 150,160 L 200,50" fill="none" stroke="#64748b" stroke-width="3" />
    <path d="M 100,50 L 120,110 L 150,160 L 180,110 L 200,50" fill="#f1f5f9" stroke="#64748b" stroke-width="2" />
    
    <!-- Center Placket -->
    <line x1="150" y1="160" x2="150" y2="390" stroke="#cbd5e1" stroke-width="3" />
    
    <!-- Buttons -->
    <circle cx="150" cy="200" r="5" fill="#475569" />
    <circle cx="150" cy="250" r="5" fill="#475569" />
    <circle cx="150" cy="300" r="5" fill="#475569" />
    <circle cx="150" cy="350" r="5" fill="#475569" />
    
    <!-- Chest Pocket with Pen -->
    <rect x="180" y="190" width="30" height="40" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
    <line x1="190" y1="175" x2="190" y2="190" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
    <circle cx="190" cy="173" r="2" fill="#0369a1" />

    <!-- Side Pockets -->
    <rect x="90" y="290" width="45" height="55" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
    <rect x="165" y="290" width="45" height="55" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />

    <!-- Lab Badge -->
    <rect x="95" y="195" width="32" height="18" rx="3" fill="#047857" />
    <text x="111" y="208" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle">LAB</text>
  </g>

  <!-- Tag Pill -->
  <rect x="40" y="40" width="180" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="60" cy="58" r="6" fill="#0284c7" />
  <text x="75" y="63" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#1e293b">Alat Praktikum</text>
</svg>