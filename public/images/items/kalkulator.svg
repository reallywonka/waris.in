<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="calc-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#e2e8f0" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#f1f5f9" />
  <rect width="800" height="600" fill="url(#calc-dots)" />

  <!-- Podium / Base Shadow -->
  <ellipse cx="400" cy="530" rx="200" ry="24" fill="#cbd5e1" opacity="0.6" />

  <!-- Scientific Calculator Body -->
  <g transform="translate(270, 70)">
    <!-- Case Exterior -->
    <rect x="0" y="0" width="260" height="440" rx="36" fill="#1e293b" stroke="#0f172a" stroke-width="4" />
    
    <!-- Top Branding & Solar Cell -->
    <text x="25" y="40" font-family="'Plus Jakarta Sans', monospace" font-size="14" font-weight="800" fill="#94a3b8" letter-spacing="2">CASIO</text>
    <text x="25" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#64748b">fx-991EX</text>
    
    <!-- Solar Panel -->
    <rect x="165" y="26" width="70" height="26" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5" />
    <line x1="188" y1="26" x2="188" y2="52" stroke="#475569" stroke-width="1.5" />
    <line x1="212" y1="26" x2="212" y2="52" stroke="#475569" stroke-width="1.5" />

    <!-- High-Resolution LCD Screen -->
    <rect x="20" y="68" width="220" height="80" rx="8" fill="#d1d5db" stroke="#0f172a" stroke-width="2" />
    <rect x="25" y="73" width="210" height="70" rx="5" fill="#f1f5f9" />
    <text x="35" y="98" font-family="monospace" font-size="13" font-weight="700" fill="#475569">√2 × ∫(x²+3) dx</text>
    <text x="220" y="132" font-family="monospace" font-size="24" font-weight="800" fill="#0f172a" text-anchor="end">42.8571</text>

    <!-- Navigation Keypad (D-Pad Oval) -->
    <ellipse cx="130" cy="180" rx="34" ry="22" fill="#475569" stroke="#334155" stroke-width="2" />
    <circle cx="130" cy="180" r="10" fill="#1e293b" />
    <!-- Shift / Alpha Function Keys -->
    <rect x="25" y="166" width="30" height="18" rx="5" fill="#eab308" />
    <rect x="65" y="166" width="30" height="18" rx="5" fill="#ef4444" />
    <rect x="165" y="166" width="30" height="18" rx="5" fill="#64748b" />
    <rect x="205" y="166" width="30" height="18" rx="5" fill="#64748b" />

    <!-- Function Keys Grid -->
    <g fill="#475569" rx="4">
      <rect x="25" y="200" width="34" height="20" rx="4" />
      <rect x="68" y="200" width="34" height="20" rx="4" />
      <rect x="111" y="200" width="34" height="20" rx="4" />
      <rect x="154" y="200" width="34" height="20" rx="4" />
      <rect x="197" y="200" width="34" height="20" rx="4" />

      <rect x="25" y="228" width="34" height="20" rx="4" />
      <rect x="68" y="228" width="34" height="20" rx="4" />
      <rect x="111" y="228" width="34" height="20" rx="4" />
      <rect x="154" y="228" width="34" height="20" rx="4" />
      <rect x="197" y="228" width="34" height="20" rx="4" />
    </g>

    <!-- Number Pad Keys Grid -->
    <g fill="#f8fafc" rx="5">
      <!-- Row 7 8 9 DEL AC -->
      <rect x="25" y="260" width="36" height="28" rx="6" />
      <rect x="71" y="260" width="36" height="28" rx="6" />
      <rect x="117" y="260" width="36" height="28" rx="6" />
      <rect x="163" y="260" width="34" height="28" rx="6" fill="#0284c7" />
      <rect x="201" y="260" width="34" height="28" rx="6" fill="#dc2626" />

      <!-- Row 4 5 6 * / -->
      <rect x="25" y="296" width="36" height="28" rx="6" />
      <rect x="71" y="296" width="36" height="28" rx="6" />
      <rect x="117" y="296" width="36" height="28" rx="6" />
      <rect x="163" y="296" width="34" height="28" rx="6" fill="#334155" />
      <rect x="201" y="296" width="34" height="28" rx="6" fill="#334155" />

      <!-- Row 1 2 3 + - -->
      <rect x="25" y="332" width="36" height="28" rx="6" />
      <rect x="71" y="332" width="36" height="28" rx="6" />
      <rect x="117" y="332" width="36" height="28" rx="6" />
      <rect x="163" y="332" width="34" height="28" rx="6" fill="#334155" />
      <rect x="201" y="332" width="34" height="28" rx="6" fill="#334155" />

      <!-- Row 0 . x10 Ans = -->
      <rect x="25" y="368" width="36" height="28" rx="6" />
      <rect x="71" y="368" width="36" height="28" rx="6" />
      <rect x="117" y="368" width="36" height="28" rx="6" fill="#334155" />
      <rect x="163" y="368" width="34" height="28" rx="6" fill="#334155" />
      <rect x="201" y="368" width="34" height="28" rx="6" fill="#15803d" />
    </g>
  </g>
  
  <!-- Pill Indicator -->
  <rect x="40" y="40" width="220" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="60" cy="58" r="6" fill="#15803d" />
  <text x="75" y="63" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#1e293b">Elektronik &amp; Alat Belajar</text>
</svg>