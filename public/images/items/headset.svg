<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="headset-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#e2e8f0" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#f8fafc" />
  <rect width="800" height="600" fill="url(#headset-dots)" />
  <ellipse cx="400" cy="510" rx="170" ry="20" fill="#cbd5e1" opacity="0.6" />

  <!-- Headset Graphics -->
  <g transform="translate(250, 100)">
    <!-- Headband Arc -->
    <path d="M 50 250 A 130 140 0 0 1 250 250" fill="none" stroke="#1e293b" stroke-width="32" stroke-linecap="round" />
    <path d="M 60 230 A 120 120 0 0 1 240 230" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round" />

    <!-- Left Ear Cup -->
    <rect x="20" y="220" width="60" height="120" rx="30" fill="#0f172a" stroke="#0284c7" stroke-width="4" />
    <rect x="10" y="240" width="20" height="80" rx="10" fill="#334155" />

    <!-- Right Ear Cup -->
    <rect x="220" y="220" width="60" height="120" rx="30" fill="#0f172a" stroke="#0284c7" stroke-width="4" />
    <rect x="270" y="240" width="20" height="80" rx="10" fill="#334155" />

    <!-- Microphone Boom -->
    <path d="M 40 320 Q 20 380 90 400" fill="none" stroke="#475569" stroke-width="6" stroke-linecap="round" />
    <rect x="90" y="392" width="28" height="16" rx="8" fill="#0ea5e9" />
  </g>

  <!-- Tag Pill -->
  <rect x="40" y="40" width="180" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="60" cy="58" r="6" fill="#0284c7" />
  <text x="75" y="63" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#1e293b">Gaming &amp; Audio</text>
</svg>