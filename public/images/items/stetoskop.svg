<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="med-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#e2e8f0" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#f8fafc" />
  <rect width="800" height="600" fill="url(#med-dots)" />
  <ellipse cx="400" cy="520" rx="190" ry="22" fill="#cbd5e1" opacity="0.6" />

  <!-- Stethoscope Graphic -->
  <g transform="translate(250, 80)">
    <!-- Earpieces -->
    <path d="M 80,60 C 90,120 120,160 150,170" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
    <path d="M 220,60 C 210,120 180,160 150,170" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" />
    <circle cx="80" cy="60" r="8" fill="#334155" />
    <circle cx="220" cy="60" r="8" fill="#334155" />

    <!-- Spring bar -->
    <path d="M 95,110 Q 150,130 205,110" fill="none" stroke="#64748b" stroke-width="4" />

    <!-- Tubing -->
    <path d="M 150,170 C 150,260 90,320 90,380 C 90,440 210,440 210,360 C 210,300 170,290 170,330" fill="none" stroke="#047857" stroke-width="12" stroke-linecap="round" />

    <!-- Chest piece / Bell -->
    <circle cx="170" cy="330" r="32" fill="#cbd5e1" stroke="#475569" stroke-width="4" />
    <circle cx="170" cy="330" r="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" />
    <circle cx="170" cy="330" r="8" fill="#047857" />
  </g>

  <!-- Tag Pill -->
  <rect x="40" y="40" width="180" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="60" cy="58" r="6" fill="#047857" />
  <text x="75" y="63" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#1e293b">Alat Praktikum</text>
</svg>