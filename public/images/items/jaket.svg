<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="jaket-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#e2e8f0" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#f8fafc" />
  <rect width="800" height="600" fill="url(#jaket-dots)" />
  <ellipse cx="400" cy="520" rx="180" ry="20" fill="#cbd5e1" opacity="0.6" />

  <!-- Jacket Graphic -->
  <g transform="translate(230, 110)">
    <!-- Main Jacket Body -->
    <path d="M 90 40 L 40 100 L 70 340 L 270 340 L 300 100 L 250 40 L 200 70 L 170 120 L 140 70 Z" fill="#047857" stroke="#065f46" stroke-width="4" stroke-linejoin="round" />
    
    <!-- Sleeves -->
    <path d="M 40 100 L 0 240 L 40 250 L 70 150 Z" fill="#059669" stroke="#065f46" stroke-width="3" />
    <path d="M 300 100 L 340 240 L 300 250 L 270 150 Z" fill="#059669" stroke="#065f46" stroke-width="3" />

    <!-- Lapels / Collar -->
    <path d="M 140 70 L 170 200 L 170 340" stroke="#064e3b" stroke-width="4" />
    <path d="M 200 70 L 170 200" stroke="#064e3b" stroke-width="4" />

    <!-- Campus Crest / Pin on Chest -->
    <circle cx="120" cy="150" r="18" fill="#fbbf24" stroke="#d97706" stroke-width="2" />
    <text x="120" y="155" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#78350f" text-anchor="middle">UNIV</text>

    <!-- Buttons -->
    <circle cx="170" cy="220" r="6" fill="#fbbf24" />
    <circle cx="170" cy="260" r="6" fill="#fbbf24" />
    <circle cx="170" cy="300" r="6" fill="#fbbf24" />

    <!-- Size Label Badge -->
    <rect x="230" y="270" width="36" height="24" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="248" y="287" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#065f46" text-anchor="middle">L</text>
  </g>

  <!-- Tag Pill -->
  <rect x="40" y="40" width="170" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="60" cy="58" r="6" fill="#047857" />
  <text x="75" y="63" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#1e293b">Fashion &amp; Jaket</text>
</svg>