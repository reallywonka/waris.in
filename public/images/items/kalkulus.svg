<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="kalkulus-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#e2e8f0" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#f8fafc" />
  <rect width="800" height="600" fill="url(#kalkulus-dots)" />
  <ellipse cx="400" cy="510" rx="190" ry="20" fill="#cbd5e1" opacity="0.6" />

  <!-- Calculus Book Graphic -->
  <g transform="translate(260, 90)">
    <rect x="25" y="25" width="260" height="370" rx="12" fill="#0f172a" />
    <rect x="15" y="15" width="260" height="370" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
    <line x1="270" y1="25" x2="270" y2="375" stroke="#94a3b8" stroke-width="4" stroke-dasharray="2,2" />
    
    <rect x="0" y="0" width="260" height="370" rx="12" fill="#1e3a8a" stroke="#172554" stroke-width="3" />
    <line x1="30" y1="0" x2="30" y2="370" stroke="#0f172a" stroke-width="4" />
    
    <!-- Cover Content -->
    <rect x="55" y="45" width="180" height="150" rx="8" fill="#172554" />
    <text x="70" y="80" font-family="'Plus Jakarta Sans', monospace" font-size="28" font-weight="900" fill="#fbbf24">&int; dx</text>
    <text x="70" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="900" fill="#ffffff">KALKULUS</text>
    <text x="70" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#93c5fd">Edisi Kesembilan Jilid 1</text>
    <text x="70" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="500" fill="#bfdbfe">Dale Varberg &bull; Purcell</text>
    
    <!-- Integral formula curve -->
    <path d="M 55,240 Q 145,210 235,260" fill="none" stroke="#60a5fa" stroke-width="3" />
    <circle cx="145" cy="225" r="4" fill="#fbbf24" />

    <rect x="55" y="290" width="95" height="24" rx="12" fill="#2563eb" />
    <text x="102" y="306" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">TEKNIK &amp; MIPA</text>
    <text x="55" y="340" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#bfdbfe">Pegangan Wajib TPB</text>
  </g>

  <!-- Tag Pill -->
  <rect x="40" y="40" width="170" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="60" cy="58" r="6" fill="#1e3a8a" />
  <text x="75" y="63" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#1e293b">Buku &amp; Catatan</text>
</svg>