<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="modul-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#e2e8f0" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#f8fafc" />
  <rect width="800" height="600" fill="url(#modul-dots)" />
  <ellipse cx="400" cy="520" rx="180" ry="20" fill="#cbd5e1" opacity="0.6" />

  <!-- Ring-bound Study Module Graphic -->
  <g transform="translate(250, 90)">
    <!-- Back Binder Shadow -->
    <rect x="20" y="20" width="280" height="370" rx="12" fill="#0f172a" opacity="0.3" />
    
    <!-- Module Body -->
    <rect x="0" y="0" width="280" height="370" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
    
    <!-- Spiral Wire Binding on Left -->
    <g fill="#475569" stroke="#334155" stroke-width="1">
      <ellipse cx="20" cy="40" rx="8" ry="14" />
      <ellipse cx="20" cy="80" rx="8" ry="14" />
      <ellipse cx="20" cy="120" rx="8" ry="14" />
      <ellipse cx="20" cy="160" rx="8" ry="14" />
      <ellipse cx="20" cy="200" rx="8" ry="14" />
      <ellipse cx="20" cy="240" rx="8" ry="14" />
      <ellipse cx="20" cy="280" rx="8" ry="14" />
      <ellipse cx="20" cy="320" rx="8" ry="14" />
    </g>

    <!-- Header & Content Lines -->
    <rect x="50" y="40" width="200" height="36" rx="6" fill="#e2e8f0" />
    <text x="65" y="63" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="800" fill="#1e293b">BANK SOAL &amp; MODUL</text>
    
    <text x="50" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#dc2626">HUKUM BISNIS</text>
    <text x="50" y="130" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">Semester Gasal — Kumpulan Ujian</text>

    <!-- Document simulation lines -->
    <line x1="50" y1="160" x2="240" y2="160" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    <line x1="50" y1="185" x2="220" y2="185" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    <line x1="50" y1="210" x2="250" y2="210" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    <line x1="50" y1="235" x2="190" y2="235" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    <line x1="50" y1="260" x2="240" y2="260" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    
    <!-- Stamp / Watermark -->
    <rect x="130" y="280" width="110" height="50" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" transform="rotate(-5)" />
    <text x="185" y="312" font-family="sans-serif" font-size="12" font-weight="800" fill="#dc2626" text-anchor="middle" transform="rotate(-5)">ARSIP LENGKAP</text>
  </g>

  <!-- Tag Pill -->
  <rect x="40" y="40" width="160" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="60" cy="58" r="6" fill="#dc2626" />
  <text x="75" y="63" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#1e293b">Buku &amp; Catatan</text>
</svg>