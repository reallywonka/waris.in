<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="tas-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#e2e8f0" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#f8fafc" />
  <rect width="800" height="600" fill="url(#tas-dots)" />
  <ellipse cx="400" cy="520" rx="170" ry="20" fill="#cbd5e1" opacity="0.6" />

  <!-- Backpack Graphic -->
  <g transform="translate(260, 90)">
    <!-- Top Carry Handle -->
    <path d="M 100 60 A 40 40 0 0 1 180 60" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round" />

    <!-- Main Compartment -->
    <rect x="30" y="50" width="220" height="350" rx="45" fill="#1e293b" stroke="#0f172a" stroke-width="4" />
    
    <!-- Zipper Arc -->
    <path d="M 50 140 Q 140 100 230 140" fill="none" stroke="#94a3b8" stroke-width="4" stroke-dasharray="4,4" />

    <!-- Front Pocket -->
    <rect x="45" y="180" width="190" height="180" rx="28" fill="#334155" stroke="#0f172a" stroke-width="3" />
    <!-- Front Pocket Zipper & Accent -->
    <line x1="65" y1="220" x2="215" y2="220" stroke="#f59e0b" stroke-width="4" />
    <rect x="120" y="216" width="16" height="10" rx="3" fill="#ffffff" />

    <!-- Brand Badge -->
    <rect x="110" y="280" width="60" height="24" rx="4" fill="#0f172a" />
    <text x="140" y="296" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">BODYPACK</text>
  </g>

  <!-- Tag Pill -->
  <rect x="40" y="40" width="190" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="60" cy="58" r="6" fill="#334155" />
  <text x="75" y="63" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#1e293b">Perlengkapan Kuliah</text>
</svg>