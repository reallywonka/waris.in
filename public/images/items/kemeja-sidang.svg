<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="kemeja-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#e2e8f0" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#f8fafc" />
  <rect width="800" height="600" fill="url(#kemeja-dots)" />
  <ellipse cx="400" cy="510" rx="170" ry="20" fill="#cbd5e1" opacity="0.6" />

  <!-- White Formal Shirt -->
  <g transform="translate(260, 100)">
    <!-- Body -->
    <path d="M 80,60 L 30,120 L 10,240 L 50,250 L 60,160 L 60,370 L 220,370 L 220,160 L 230,250 L 270,240 L 250,120 L 200,60 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="3" stroke-linejoin="round" />

    <!-- Tie (Dasi Hitam Formal) -->
    <path d="M 132,68 L 148,68 L 144,90 L 136,90 Z" fill="#0f172a" />
    <path d="M 136,90 L 144,90 L 152,240 L 140,265 L 128,240 Z" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" />

    <!-- Collar -->
    <path d="M 80,60 L 125,75 L 140,110 L 95,75 Z" fill="#f8fafc" stroke="#64748b" stroke-width="2" />
    <path d="M 200,60 L 155,75 L 140,110 L 185,75 Z" fill="#f8fafc" stroke="#64748b" stroke-width="2" />

    <!-- Placket & Buttons -->
    <line x1="140" y1="110" x2="140" y2="370" stroke="#e2e8f0" stroke-width="3" />
    <circle cx="140" cy="150" r="4" fill="#94a3b8" />
    <circle cx="140" cy="200" r="4" fill="#94a3b8" />
    <circle cx="140" cy="250" r="4" fill="#94a3b8" />
    <circle cx="140" cy="300" r="4" fill="#94a3b8" />

    <!-- Chest Pocket -->
    <path d="M 175,170 L 205,170 L 205,210 L 190,220 L 175,210 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  </g>

  <!-- Tag Pill -->
  <rect x="40" y="40" width="180" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="60" cy="58" r="6" fill="#6366f1" />
  <text x="75" y="63" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#1e293b">Fashion &amp; Jaket</text>
</svg>