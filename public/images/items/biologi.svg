<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="bio-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#e2e8f0" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#f8fafc" />
  <rect width="800" height="600" fill="url(#bio-dots)" />
  <ellipse cx="400" cy="520" rx="180" ry="20" fill="#cbd5e1" opacity="0.6" />

  <!-- Biology Lab Tools -->
  <g transform="translate(240, 100)">
    <!-- Lab Tool Tray -->
    <rect x="0" y="260" width="320" height="120" rx="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3" />
    
    <!-- Erlenmeyer Flask -->
    <g transform="translate(60, 40)">
      <path d="M 50 40 L 50 90 L 10 190 A 20 20 0 0 0 25 220 L 115 220 A 20 20 0 0 0 130 190 L 90 90 L 90 40 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="4" stroke-linejoin="round" />
      <path d="M 23 180 Q 70 160 117 180 L 123 210 L 17 210 Z" fill="#38bdf8" opacity="0.6" />
      <rect x="42" y="32" width="56" height="12" rx="4" fill="#0284c7" />
    </g>

    <!-- Tweezers / Pinset -->
    <path d="M 220 80 L 200 240 M 220 80 L 210 240" stroke="#64748b" stroke-width="5" stroke-linecap="round" />

    <!-- Glass slides in box -->
    <rect x="230" y="160" width="70" height="90" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" />
    <line x1="240" y1="180" x2="290" y2="180" stroke="#38bdf8" stroke-width="3" />
    <line x1="240" y1="200" x2="290" y2="200" stroke="#38bdf8" stroke-width="3" />
    <line x1="240" y1="220" x2="290" y2="220" stroke="#38bdf8" stroke-width="3" />
  </g>

  <!-- Tag Pill -->
  <rect x="40" y="40" width="170" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="60" cy="58" r="6" fill="#0284c7" />
  <text x="75" y="63" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#1e293b">Alat Praktikum</text>
</svg>