<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="buku-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#e2e8f0" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#f8fafc" />
  <rect width="800" height="600" fill="url(#buku-dots)" />
  <ellipse cx="400" cy="510" rx="190" ry="20" fill="#cbd5e1" opacity="0.6" />

  <!-- Book Graphics -->
  <g transform="translate(260, 90)">
    <!-- Book Shadow/Back Cover -->
    <rect x="25" y="25" width="260" height="370" rx="12" fill="#0f172a" />
    <!-- Pages Stack -->
    <rect x="15" y="15" width="260" height="370" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
    <line x1="270" y1="25" x2="270" y2="375" stroke="#94a3b8" stroke-width="4" stroke-dasharray="2,2" />
    
    <!-- Front Cover -->
    <rect x="0" y="0" width="260" height="370" rx="12" fill="#15803d" stroke="#166534" stroke-width="3" />
    <!-- Spine binding line -->
    <line x1="30" y1="0" x2="30" y2="370" stroke="#14532d" stroke-width="4" />
    
    <!-- Cover Content -->
    <rect x="55" y="50" width="180" height="130" rx="8" fill="#14532d" />
    <text x="70" y="90" font-family="'Plus Jakarta Sans', monospace" font-size="16" font-weight="800" fill="#86efac">&lt;code&gt;</text>
    <text x="70" y="120" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#ffffff">Pemrograman</text>
    <text x="70" y="145" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#bbf7d0">Web &amp; Framework</text>
    
    <!-- Framework Badges on Cover -->
    <rect x="55" y="220" width="70" height="24" rx="12" fill="#dc2626" />
    <text x="90" y="236" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">LARAVEL</text>

    <rect x="135" y="220" width="60" height="24" rx="12" fill="#0284c7" />
    <text x="165" y="236" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">REACT</text>

    <line x1="55" y1="280" x2="235" y2="280" stroke="#86efac" stroke-width="2" opacity="0.4" />
    <text x="55" y="315" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#dcfce7">Edisi Lengkap Mahasiswa</text>
  </g>

  <!-- Tag Pill -->
  <rect x="40" y="40" width="170" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="60" cy="58" r="6" fill="#15803d" />
  <text x="75" y="63" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#1e293b">Buku &amp; Catatan</text>
</svg>