<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="arch-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#e2e8f0" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#f8fafc" />
  <rect width="800" height="600" fill="url(#arch-dots)" />
  <ellipse cx="400" cy="520" rx="200" ry="24" fill="#cbd5e1" opacity="0.6" />

  <!-- T-Square & Drawing Tube -->
  <g transform="translate(220, 90)">
    <!-- Drawing Tube (Tabung Gambar) tilted -->
    <g transform="rotate(-25 150 200)">
      <rect x="130" y="20" width="45" height="380" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="3" />
      <!-- Strap -->
      <path d="M 125,80 C 80,180 80,260 125,340" fill="none" stroke="#d97706" stroke-width="8" stroke-linecap="round" />
      <rect x="127" y="15" width="51" height="35" rx="5" fill="#334155" />
      <line x1="130" y1="120" x2="175" y2="120" stroke="#475569" stroke-width="3" />
      <line x1="130" y1="300" x2="175" y2="300" stroke="#475569" stroke-width="3" />
    </g>

    <!-- T-Square Ruler -->
    <!-- Head of T-Square -->
    <rect x="140" y="80" width="28" height="150" rx="4" fill="#b45309" stroke="#78350f" stroke-width="2" />
    <!-- Blade of T-Square -->
    <rect x="168" y="140" width="240" height="30" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
    <!-- Ruler markings -->
    <line x1="185" y1="140" x2="185" y2="152" stroke="#78350f" stroke-width="1.5" />
    <line x1="205" y1="140" x2="205" y2="152" stroke="#78350f" stroke-width="1.5" />
    <line x1="225" y1="140" x2="225" y2="152" stroke="#78350f" stroke-width="1.5" />
    <line x1="245" y1="140" x2="245" y2="152" stroke="#78350f" stroke-width="1.5" />
    <line x1="265" y1="140" x2="265" y2="152" stroke="#78350f" stroke-width="1.5" />
    <line x1="285" y1="140" x2="285" y2="152" stroke="#78350f" stroke-width="1.5" />
    <line x1="305" y1="140" x2="305" y2="152" stroke="#78350f" stroke-width="1.5" />
    <line x1="325" y1="140" x2="325" y2="152" stroke="#78350f" stroke-width="1.5" />
    <line x1="345" y1="140" x2="345" y2="152" stroke="#78350f" stroke-width="1.5" />
    <line x1="365" y1="140" x2="365" y2="152" stroke="#78350f" stroke-width="1.5" />
    <line x1="385" y1="140" x2="385" y2="152" stroke="#78350f" stroke-width="1.5" />
    <circle cx="154" cy="155" r="5" fill="#fef3c7" stroke="#78350f" stroke-width="1.5" />
  </g>

  <!-- Tag Pill -->
  <rect x="40" y="40" width="200" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="60" cy="58" r="6" fill="#d97706" />
  <text x="75" y="63" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#1e293b">Perlengkapan Kuliah</text>
</svg>