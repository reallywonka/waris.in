<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="kimia-dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#e2e8f0" />
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#f8fafc" />
  <rect width="800" height="600" fill="url(#kimia-dots)" />
  <ellipse cx="400" cy="510" rx="190" ry="20" fill="#cbd5e1" opacity="0.6" />

  <!-- Organic Chemistry Book -->
  <g transform="translate(260, 90)">
    <rect x="25" y="25" width="260" height="370" rx="12" fill="#0f172a" />
    <rect x="15" y="15" width="260" height="370" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2" />
    <line x1="270" y1="25" x2="270" y2="375" stroke="#94a3b8" stroke-width="4" stroke-dasharray="2,2" />
    
    <rect x="0" y="0" width="260" height="370" rx="12" fill="#065f46" stroke="#064e3b" stroke-width="3" />
    <line x1="30" y1="0" x2="30" y2="370" stroke="#022c22" stroke-width="4" />
    
    <!-- Cover Content -->
    <rect x="55" y="45" width="180" height="150" rx="8" fill="#044e3b" />
    <!-- Benzene Ring Molecule -->
    <polygon points="145,65 165,77 165,100 145,112 125,100 125,77" fill="none" stroke="#6ee7b7" stroke-width="3" />
    <circle cx="145" cy="88" r="12" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-dasharray="3,3" />

    <text x="70" y="135" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="900" fill="#ffffff">KIMIA ORGANIK</text>
    <text x="70" y="160" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#a7f3d0">Jilid 1 &bull; Fessenden</text>
    <text x="70" y="180" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="500" fill="#d1fae5">Edisi Ketiga Terjemahan</text>
    
    <rect x="55" y="280" width="90" height="24" rx="12" fill="#059669" />
    <text x="100" y="296" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">FARMASI &amp; MIPA</text>
    <text x="55" y="335" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#a7f3d0">Lengkap Reaksi &amp; Mekanisme</text>
  </g>

  <!-- Tag Pill -->
  <rect x="40" y="40" width="170" height="36" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <circle cx="60" cy="58" r="6" fill="#065f46" />
  <text x="75" y="63" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#1e293b">Buku &amp; Catatan</text>
</svg>