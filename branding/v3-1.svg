<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t1">
  <title id="t1">waris.in - Simpul Dua Generasi (The Interlocking Loops)</title>
  <!-- Symmetrical, sublime interlocking loops forming W -->
  <g fill="none" stroke="#064E3B" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Loop (Tilted -22.5 deg around center 98, 134) -->
    <rect x="74" y="68" width="48" height="132" rx="24" transform="rotate(-22.5 98 134)"/>
    <!-- Right Loop (Tilted +22.5 deg around center 158, 134) -->
    <rect x="134" y="68" width="48" height="132" rx="24" transform="rotate(22.5 158 134)"/>
  </g>
  <!-- A subtle focal gold node at the center harmonic intersection -->
  <circle cx="128" cy="116" r="6" fill="#D97706"/>
</svg>